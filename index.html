<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
        </div>
        <div class="brand-text">
          <h1>Top-Conf Figure Gallery</h1>
          <span class="brand-description" data-i18n="brand.description">顶会论文主图灵感画廊</span>
        </div>
      </div>
      <div class="hero-right">
        <a class="forge-nav" href="./forge/" title="打开 FigureForge 画图">FigureForge ↗</a>
        <button id="lang-toggle" class="lang-toggle" type="button" title="Switch language">中/EN</button>
      </div>
    </div>
  </div>
</header>

<div class="stickbar">
  <div class="stickbar-inner">
    <div class="stick-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M21 21l-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
        <input id="search" type="search" data-i18n-ph="search.ph" autocomplete="off">
        <button id="clear-search" class="clear-btn" title="清空 / Clear" hidden>×</button>
      </div>
      <span id="result-count" class="result-count" role="status" aria-live="polite"></span>
    </div>
    <div class="filter-row">
      <label class="filter-field"><span data-i18n="fl.venue">venue</span><select id="venue-filter"></select></label>
      <label class="filter-field"><span data-i18n="fl.year">year</span><select id="year-filter"></select></label>
      <label class="filter-field"><span data-i18n="fl.tier">tier</span><select id="tier-filter"></select></label>
      <label class="filter-field"><span data-i18n="fl.pattern">pattern</span><select id="pattern-filter"></select></label>
      <div class="view-controls">
      <div class="sort-wrap">
        <label for="sort" data-i18n="sort.label">Sort</label>
        <select id="sort">
          <option value="venue" data-i18n="sort.venue">Venue → Year</option>
          <option value="year" data-i18n="sort.year">Year → Venue</option>
          <option value="title" data-i18n="sort.title">Title A–Z</option>
        </select>
      </div>
      <label class="filter-field column-field"><span data-i18n="layout.columns">列数</span><select id="column-count"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></label>
      <label class="filter-field display-field"><span data-i18n="layout.display">展示信息</span><select id="display-mode"><option value="full" data-i18n="layout.full">图片和文字</option><option value="images" data-i18n="layout.images">仅图片</option></select></label>
      </div>
    </div>
  </div>
</div>

<main class="container">
  <div id="gallery" class="masonry" aria-live="polite"></div>
  <div id="sentinel" class="sentinel" hidden>
    <span class="spinner"></span> <span data-i18n="loading">Loading more…</span>
  </div>
  <div id="end-hint" class="end-hint" hidden></div>
  <div id="empty" class="empty-state" hidden>
    <div class="empty-emoji">🔍</div>
    <p data-i18n="empty.text"></p>
    <button id="reset-all" class="ghost-btn" data-i18n="empty.reset"></button>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <section>
      <h3 data-i18n="footer.about.h"></h3>
      <p data-i18n-html="footer.about"></p>
    </section>
    <section class="footer-meta">
      <h3 data-i18n="footer.pattern.h"></h3>
      <ul class="pattern-legend">
        <li data-i18n-html="legend.teaser"></li>
        <li data-i18n-html="legend.conceptual"></li>
        <li data-i18n-html="legend.framework"></li>
        <li data-i18n-html="legend.pipeline"></li>
        <li data-i18n-html="legend.architecture"></li>
        <li data-i18n-html="legend.taxonomy"></li>
      </ul>
      <p class="repo-note" data-i18n-html="footer.note"></p>
    </section>
  </div>
</footer>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" hidden>
  <div class="lightbox-backdrop"></div>
  <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="figure details">
    <button class="lightbox-close" id="lb-close" data-i18n-aria="aria.close">×</button>
    <button class="lightbox-nav prev" id="lb-prev" data-i18n-aria="aria.prev">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <button class="lightbox-nav next" id="lb-next" data-i18n-aria="aria.next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
    </button>
    <div class="lightbox-content">
      <div class="lightbox-img-wrap">
        <img id="lb-img" src="" alt="">
      </div>
      <div class="lightbox-meta">
        <div class="lb-badges"><span id="lb-award" class="badge tier-badge" hidden></span><span id="lb-tier" class="badge tier-badge" hidden></span><span id="lb-venue" class="badge"></span><span id="lb-year" class="badge year"></span><span id="lb-pattern" class="badge pattern"></span></div>
        <h2 id="lb-title"></h2>
        <p id="lb-authors" class="lb-authors"></p>
        <div class="lb-actions">
          <a id="lb-image" class="ghost-btn" target="_blank" rel="noopener" data-i18n="lb.viewImage"></a>
          <a id="lb-paper" class="primary-btn" target="_blank" rel="noopener" data-i18n="lb.openPaper"></a>
        </div>
      </div>
    </div>
  </div>
</div>
